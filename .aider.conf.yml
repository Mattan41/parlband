# Modell via OpenRouter
model: openrouter/deepseek/deepseek-v4-pro
# model: openrouter/deepseek/deepseek-chat
# Stäng av automatiska commits så du kan granska i lugn och ro
auto-commits: false

# Visa tydliga ändringar
show-diffs: true

# Läses in automatiskt varje gång Aider startas i repot
read:
  - ARCHITECTURE.md
  - API_REFERENCE.md
  - INTEGRATION_CONTRACT.md